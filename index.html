<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Modelado Bases</title>
<style>@font-face{font-family:"JetBrains Mono";font-weight:400;font-display:swap;src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:600;font-display:swap;src:url(fonts/jetbrains-mono-latin-600-normal.woff2) format("woff2")}

/* Programa de escritorio: letra del sistema, superficies planas, poca sombra, colores suaves por tipo de elemento. */
:root{
  --side-w:248px; --en-w:300px; --in-w:300px;
  --bg:#F3F2EF; --panel:#FAF9F7; --surface:#FFFFFF; --ink:#22211F; --muted:#6B6A64; --line:#E2E0DB; --line-2:#CBC9C2; --hover:#EDEBE6;
  --accent:#2F6B4F; --accent-ink:#FFFFFF; --sel:#E1EDE6; --sel-ink:#1D3D2E;
  --er-stroke:#2B2A27; --card:#A2441C;
  --c-ent:#2F5D8A; --e-fill:#EDF3F9; --c-rel:#9C6510; --r-fill:#FBF2E0; --c-att:#3D7A4E; --a-fill:#EEF6EF; --c-key:#7A4FB8; --k-fill:#F3EDFB;
  --ded-head:#33557F; --ded-head-ink:#FFFFFF; --ded-border:#A9B2C0; --grid:#EBEBE7;
  --pk:#8E5FD0; --fk:#B4364E; --pk-ink:#6B3FA8; --fk-ink:#A3304A; --col:#2A7F8F; --ok:#2F7A4B; --warn:#A9690A; --bad:#C0362C; --folder:#D8A63A;
  --bad-bg:#FBEAE8;
  --f-ui:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --f-mono:"JetBrains Mono","Cascadia Mono",Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1C1D1F; --panel:#222326; --surface:#28292C; --ink:#E7E6E3; --muted:#A09F9A; --line:#36373A; --line-2:#47484C; --hover:#303134;
  --accent:#6DB38D; --accent-ink:#10251A; --sel:#2B4337; --sel-ink:#E3F2E9;
  --er-stroke:#D8D7D3; --card:#F0A27C;
  --c-ent:#86AEDB; --e-fill:#223040; --c-rel:#DDA94F; --r-fill:#382D1A; --c-att:#82C393; --a-fill:#1E3326; --c-key:#BC9CEB; --k-fill:#30264A;
  --ded-head:#3A5A82; --ded-head-ink:#F2F5FA; --ded-border:#4F5868; --grid:#303030;
  --pk:#B58FEC; --fk:#EE7F94; --pk-ink:#C8AEF2; --fk-ink:#F197A8; --col:#62C3D3; --ok:#6DB38D; --warn:#E0A24A; --bad:#F07067; --folder:#D8A63A;
  --bad-bg:#43211E; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1C1D1F; --panel:#222326; --surface:#28292C; --ink:#E7E6E3; --muted:#A09F9A; --line:#36373A; --line-2:#47484C; --hover:#303134;
  --accent:#6DB38D; --accent-ink:#10251A; --sel:#2B4337; --sel-ink:#E3F2E9;
  --er-stroke:#D8D7D3; --card:#F0A27C;
  --c-ent:#86AEDB; --e-fill:#223040; --c-rel:#DDA94F; --r-fill:#382D1A; --c-att:#82C393; --a-fill:#1E3326; --c-key:#BC9CEB; --k-fill:#30264A;
  --ded-head:#3A5A82; --ded-head-ink:#F2F5FA; --ded-border:#4F5868; --grid:#303030;
  --pk:#B58FEC; --fk:#EE7F94; --pk-ink:#C8AEF2; --fk-ink:#F197A8; --col:#62C3D3; --ok:#6DB38D; --warn:#E0A24A; --bad:#F07067; --folder:#D8A63A;
  --bad-bg:#43211E; color-scheme:dark;
}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.5 var(--f-ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button:disabled{opacity:.45;cursor:default!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
code{font-family:var(--f-mono);font-size:12px}
kbd{font:600 11px var(--f-mono);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:3px;padding:0 5px;background:var(--panel);white-space:nowrap}

.app{height:100%;display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);grid-template-rows:36px minmax(0,1fr) 28px;grid-template-areas:"title title" "side main" "status status"}
body.solo .app{grid-template-columns:minmax(0,1fr);grid-template-areas:"title" "main" "status"}
body.solo .side,body.solo .sb-base{display:none}

/* Barra lateral */
.side{position:relative;grid-area:side;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:9px;padding:13px 14px 11px}
.ver{font:600 10.5px var(--f-mono);color:var(--muted);border:1px solid var(--line-2);border-radius:3px;padding:0 5px;line-height:16px;background:none;cursor:default;-webkit-app-region:no-drag}
.ver:hover{color:var(--ink);border-color:var(--accent)}
.brand b{font-size:14px;font-weight:600;letter-spacing:.1px}
.logo{width:18px;height:18px;flex:none}
.side-acts{display:grid;gap:6px;padding:2px 12px 12px;border-bottom:1px solid var(--line)}
.tree{flex:1;overflow:auto;padding:6px 6px 10px}
.tree-h{font-size:11px;font-weight:600;color:var(--muted);padding:8px 8px 4px;text-transform:uppercase;letter-spacing:.06em}
.proj{margin:0}
.pf,.pi{width:100%;display:flex;align-items:center;gap:6px;border:0;background:none;border-radius:4px;cursor:pointer;text-align:left;height:27px;padding:0 6px}
.pf:hover,.pi:hover{background:var(--hover)}
.pf .chev{flex:none;color:var(--muted);transition:transform .12s}
.pf[aria-expanded="true"] .chev{transform:rotate(90deg)}
.pf .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ddot{width:7px;height:7px;border-radius:50%;background:var(--warn);flex:none;display:none}
.pf.dirty .ddot{display:block}
.win-tag{font:600 10px var(--f-ui);color:var(--muted);border:1px solid var(--line-2);border-radius:3px;padding:0 4px;line-height:15px}
.sub{padding-left:26px}
.tree-h{display:flex;align-items:center;gap:6px;border-radius:4px}
.tree-h>span{flex:1}
.tree-add{display:inline-flex;align-items:center;gap:1px;border:1px solid transparent;background:none;color:var(--muted);border-radius:4px;padding:1px 4px;cursor:pointer;font:600 12px var(--f-ui)}
.tree-add:hover{background:var(--hover);color:var(--ink);border-color:var(--line)}
.tree-add .ico{width:14px;height:14px}
.gf{width:100%;display:flex;align-items:center;gap:6px;border-radius:4px;cursor:pointer;height:27px;padding:0 6px;font-weight:600;user-select:none}
.gf:hover{background:var(--hover)}
.gf:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.gf .chev{flex:none;color:var(--muted);transition:transform .12s}
.gf[aria-expanded="true"] .chev{transform:rotate(90deg)}
.gf .gico{color:var(--accent)}
.gf .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gf .cnt{font:11px var(--f-mono);color:var(--muted);font-weight:400}
.gname{flex:1;min-width:0;font:inherit;padding:1px 4px;border:1px solid var(--accent);border-radius:3px;background:var(--bg);color:var(--ink)}
.gsub{padding-left:14px;margin-left:11px;border-left:1px solid var(--line)}
.gempty{margin:2px 6px 6px;font-size:12px;color:var(--muted)}
.dropin{background:var(--sel)!important;outline:2px dashed var(--accent);outline-offset:-2px}
.pf[draggable="true"],.gf[draggable="true"]{-webkit-user-drag:element}
.mvlist{display:grid;gap:2px;max-height:50vh;overflow:auto;margin:6px 0 4px}
.mvopt{display:flex;align-items:center;gap:8px;border:0;background:none;border-radius:4px;padding:6px 10px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.mvopt:hover:not(:disabled){background:var(--hover)}
.mvopt:disabled{opacity:.55;cursor:default}
.mvopt small{margin-left:auto;color:var(--muted)}
.mvopt .ico{color:var(--accent)}
@media (prefers-reduced-motion:reduce){ .gf .chev{transition:none} }
.pi[aria-current="true"]{background:var(--sel);color:var(--sel-ink);font-weight:600}
.pi .cnt{margin-left:auto;font:11px var(--f-mono);color:var(--muted)}
.ico{flex:none;color:var(--muted)}
.side-all{border-top:1px solid var(--line);padding:6px 8px 10px;display:grid;gap:2px}
.side-all .lnk{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lnk{border:0;background:none;color:var(--accent);cursor:pointer;padding:3px 6px;text-align:left;border-radius:3px;font-weight:500}
.lnk:hover{background:var(--hover);text-decoration:underline}

/* Barra de estado */
.statusbar{grid-area:status;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--panel);border-top:1px solid var(--line);font-size:12px;color:var(--muted);min-width:0;white-space:nowrap}
.statusbar .lnk{padding:0 4px;font-size:12px}
.sb-base{display:flex;align-items:center;gap:6px;min-width:0}
.sb-sep{width:1px;height:14px;background:var(--line-2);flex:none}
.sb-path{min-width:0;overflow:hidden;text-overflow:ellipsis}
.sb-path code{color:var(--ink)}
.sb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.sbtn{border:1px solid var(--line-2);background:var(--surface);border-radius:3px;height:20px;padding:0 8px;font-size:11.5px;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:5px}
.sbtn:hover:not(:disabled){background:var(--hover)}
.auto{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.auto input{position:absolute;opacity:0;width:0;height:0}
.auto .sw{width:24px;height:14px}
.auto .sw::after{width:10px;height:10px}
.auto:has(input:checked) .sw{background:var(--accent)}
.auto:has(input:checked) .sw::after{transform:translateX(10px)}
.auto:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:1px}
.theme{display:inline-flex;border:1px solid var(--line-2);border-radius:3px;overflow:hidden}
.theme button{border:0;background:none;padding:0 8px;height:18px;font-size:11.5px;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.theme button+button{border-left:1px solid var(--line-2)}
.theme button:hover{background:var(--hover);color:var(--ink)}
.theme button[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok)} .dot.busy{background:var(--warn)} .dot.bad{background:var(--bad)}

/* Área principal */
.mainv{grid-area:main;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.ph{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 14px 6px;background:var(--surface)}
.pname{font-size:17px;font-weight:600;border:1px solid transparent;background:none;border-radius:4px;padding:3px 6px;min-width:0;flex:1 1 220px;color:var(--ink);letter-spacing:-.1px}
.pname.static{border:0}
.pname:hover{border-color:var(--line)} .pname:focus{border-color:var(--accent);outline:none}
.ph-acts{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.ph-sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.vtabs{display:flex;gap:2px;padding:0 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.vtab{display:inline-flex;align-items:center;gap:7px;border:0;border-bottom:2px solid transparent;background:none;padding:7px 12px 6px;color:var(--muted);font-weight:500;cursor:pointer}
.vtab:hover{color:var(--ink)}
.vtab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.vtab[aria-selected="true"] .ico{color:var(--ink)}
.view{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:8px 12px 10px}

/* Botones */
.ebtn{display:inline-flex;align-items:center;gap:6px;height:28px;border:1px solid var(--line-2);background:var(--surface);padding:0 10px;border-radius:4px;cursor:pointer;font-size:12.5px;color:var(--ink);white-space:nowrap}
.ebtn:hover{background:var(--hover)}
.ebtn:active{transform:translateY(.5px)}
.ebtn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.ebtn.pri:hover{filter:brightness(1.08)}
.ebtn.danger{color:var(--bad)}
.ebtn.danger-pri{background:var(--bad);border-color:var(--bad);color:#fff}
.ebtn[aria-pressed="true"],.ebtn.on{background:var(--sel);border-color:var(--accent);color:var(--sel-ink)}
.ebtn.add::before{content:"+";font-weight:700;margin-right:1px}
.ph .ebtn{height:26px;padding:0 9px;border-color:transparent;background:none;color:var(--muted)}
.ph .ebtn:hover{background:var(--hover);color:var(--ink);border-color:var(--line)}
.ph .ebtn.danger{color:var(--bad)}

/* Editor */
.ed-tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:5px}
.tgroup{display:flex;gap:2px;align-items:center;padding-right:6px;border-right:1px solid var(--line)}
.tgroup:last-of-type{border-right:0}
.tspace{flex:1}
.tnote{font-size:11.5px;color:var(--muted);padding-right:6px}
.ed-tools .ebtn{border-color:transparent;background:none}
.ed-tools .ebtn:hover{background:var(--hover);border-color:var(--line)}
.ed-tools .ebtn[aria-pressed="true"]{background:var(--sel);border-color:var(--accent)}
.ed-tools .ebtn.tool{height:36px;flex-direction:column;gap:1px;padding:2px 10px;font-size:11.5px;line-height:1.1;min-width:60px;justify-content:center}
.ed-tools .ebtn.tool .gl{width:24px;height:16px}
.ed-tools .ebtn.toggle[aria-pressed="true"] .gl path{fill:var(--pk)}
.ed-tools .ebtn.danger{color:var(--bad)}
.ed-tools .ebtn.danger .gl{color:var(--bad)}
.ed-main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(280px,1fr) 9px var(--in-w);grid-template-areas:"cv sp2 in";gap:0}
.ed-main.withenun{grid-template-columns:var(--en-w) 9px minmax(280px,1fr) 9px var(--in-w);grid-template-areas:"en sp1 cv sp2 in"}
.ed-main.noinsp{grid-template-columns:minmax(280px,1fr)}
.ed-main.withenun.noinsp{grid-template-columns:var(--en-w) 9px minmax(280px,1fr)}
.ed-main.noinsp .ed-in,.ed-main.noinsp .split[data-split="in"]{display:none}
.ed-en{grid-area:en;display:flex;flex-direction:column;min-height:0}
.ed-en textarea{flex:1}
.ed-cvc{grid-area:cv;display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
.ed-cvc .ed-cv{flex:1}
.bo-zone{display:flex;flex-direction:column;gap:4px}
.bo-zone .lbl{margin:0}.bo-zone code{font:11.5px var(--f-mono);background:var(--panel);padding:0 4px;border-radius:3px}
.bo-txt{height:96px;min-height:52px;max-height:40vh;resize:vertical;font:12.5px/1.5 var(--f-mono);padding:6px 10px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);color:var(--ink)}
.bo-txt:focus{outline:2px solid var(--accent);outline-offset:-1px}
.boe .segb{font-size:12px;padding:4px 2px}
.bo-leg{font-size:12px}
.cx-t{font:600 11px var(--f-mono)}
.ed-cv{position:relative;overflow:hidden;border:1px solid var(--line-2);border-radius:5px;background:var(--surface);min-height:0}
.ed-cv svg{position:absolute;inset:0;display:block;width:100%;height:100%;user-select:none}
.ed-cv.panning,.ed-cv.panning *{cursor:grabbing!important}
svg .pdot{fill:var(--line-2)}
.zoombar{position:absolute;right:10px;bottom:10px;display:flex;border:1px solid var(--line-2);border-radius:4px;background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.10);overflow:hidden}
.zb{border:0;background:none;height:26px;min-width:28px;padding:0 8px;font:600 12.5px var(--f-ui);color:var(--ink);cursor:pointer}
.zb+.zb{border-left:1px solid var(--line)}
.zb:hover{background:var(--hover)}
.zpct{min-width:58px;font-family:var(--f-mono);font-weight:400;font-size:12px;color:var(--muted)}
.ed-in{grid-area:in;overflow:auto;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:10px 12px}
.in-h{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.in-h>span{flex:1;display:flex;align-items:center;gap:6px}
.badge{font:600 10.5px var(--f-mono);text-transform:none;letter-spacing:0;background:var(--r-fill);color:var(--c-rel);border:1px solid var(--c-rel);border-radius:3px;padding:0 5px}
.pinb{border:1px solid transparent;background:none;border-radius:3px;padding:2px 4px;cursor:pointer;color:var(--muted)}
.pinb:hover{background:var(--hover);border-color:var(--line)}
.pinb[aria-pressed="true"]{background:var(--sel);border-color:var(--accent);color:var(--sel-ink)}
.in-p{font-size:12.5px;color:var(--muted);margin:.4em 0}
.in-p.warn{color:var(--bad)}
.in-sub{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px}
.in-sub .cnt{font:11px var(--f-mono);text-transform:none}
.fld{display:grid;gap:3px;margin-bottom:6px;font-size:12px;color:var(--muted)}
.ed-in input[type=text],.ed-in select{font:12.5px var(--f-mono);color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:4px;padding:4px 7px;width:100%;min-width:0;height:28px}
.ed-in input[type=text]:focus,.ed-in select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ed-in input.bad{border-color:var(--bad)!important;background:var(--bad-bg);color:var(--bad);box-shadow:0 0 0 1px var(--bad)!important}
.dupmsg{font-size:12px;color:var(--bad);margin:0 0 8px;font-weight:600}
.gl{flex:none;display:block}
.ebtn .gl{color:var(--muted)}
.ebtn:hover .gl,.ebtn[aria-pressed="true"] .gl{color:currentColor}
/* Tarjetas que se encienden */
.chk{position:relative;display:flex;gap:10px;align-items:center;margin:4px 0;padding:6px 10px;border:1px solid var(--line);background:var(--surface);border-radius:4px;cursor:pointer;user-select:none}
.chk:hover{border-color:var(--line-2);background:var(--hover)}
.chk input,.tg input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.chk-ic{width:26px;display:flex;justify-content:center;color:var(--muted)}
.chk-t{flex:1;min-width:0;font-size:12.5px;font-weight:600;line-height:1.3}
.chk-t small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.sw{width:28px;height:16px;border-radius:8px;background:var(--line-2);position:relative;flex:none;transition:background .12s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--surface);transition:transform .12s}
.chk:has(input:checked){border-color:var(--accent);background:var(--sel)}
.chk:has(input:checked) .chk-ic{color:var(--sel-ink)}
.chk:has(input:checked) .sw{background:var(--accent)}
.chk:has(input:checked) .sw::after{transform:translateX(12px)}
.chk:has(input:focus-visible),.tg:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:1px}
/* Lista de atributos de una entidad */
.alist{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.aitem{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 8px 0 5px;border:1px solid var(--line);background:var(--surface);border-radius:13px;cursor:pointer;font:12px var(--f-mono);color:var(--ink)}
.aitem .gl{width:20px;height:14px}
.aitem em{font:600 10px var(--f-ui);font-style:normal;color:var(--pk-ink)}
.aitem:hover{border-color:var(--c-att);background:var(--a-fill)}
.aitem.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
/* Columnas */
.tgs{display:flex;flex-wrap:wrap;gap:4px;width:100%}
.tg{position:relative;display:inline-flex;align-items:center;gap:3px;height:24px;padding:0 7px 0 5px;border:1px solid var(--line-2);border-radius:4px;background:var(--surface);font:600 11px var(--f-ui);color:var(--muted);cursor:pointer;user-select:none}
.tg .gl{width:20px;height:14px}
.tg:hover{background:var(--hover);color:var(--ink)}
.tg:has(input:checked){background:var(--sel);border-color:var(--accent);color:var(--sel-ink)}
.colrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:4px;background:var(--surface);margin-bottom:4px}
.colrow input[type=text]{flex:1 1 100px;width:auto}
.colrow input.ctype{flex:1 1 90px}
.colrow>input{order:0}.colrow .xbtn{order:1;margin-left:0}.colrow .tgs{order:2}.colrow select{order:3}
.colrow select{flex:1 1 100%;width:auto}
.xbtn{margin-left:auto;border:0;background:none;color:var(--muted);cursor:pointer;padding:2px 6px;border-radius:3px;font-size:12px}
.xbtn:hover{background:var(--hover);color:var(--bad)}
.in-actions{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
/* Cardinalidades */
.cq{border:1px solid var(--line);border-left:3px solid var(--card);background:var(--surface);border-radius:4px;padding:7px 10px;margin:6px 0}
.in-q{font-size:13px;margin:0 0 4px;line-height:1.4}
.qe{color:var(--c-ent);font-weight:600}
.cres{font-size:11.5px;color:var(--muted);margin-top:3px}
.cardrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:4px;overflow:hidden}
.seg.wide{display:flex}.seg.wide .segb{flex:1}
.segb{border:0;background:var(--surface);padding:3px 14px;font:600 13px var(--f-mono);cursor:pointer;color:var(--ink)}
.segb+.segb{border-left:1px solid var(--line-2)}
.segb:hover{background:var(--hover)}
.segb[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.cd{font:600 12.5px var(--f-mono);color:var(--card)}
.opt{display:block;width:100%;text-align:left;margin:4px 0;padding:6px 10px;border:1px solid var(--line);background:var(--surface);border-radius:4px;cursor:pointer;font:600 12.5px var(--f-mono);color:var(--ink)}
.opt small{display:block;font:11.5px var(--f-ui);color:var(--muted)}
.opt:hover{background:var(--hover)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));box-shadow:inset 3px 0 0 var(--accent)}
textarea.notes{width:100%;font:14px/1.6 var(--f-ui);color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:5px;padding:12px 14px;resize:none;min-height:200px}
textarea.notes:focus{outline:none;border-color:var(--accent)}
.enview{flex:1;display:flex;flex-direction:column;min-height:0;max-width:900px}
.enview textarea{flex:1}
/* Subrayador del enunciado */
.hlwrap{position:relative;flex:1;display:flex;min-height:0}
.hlwrap textarea.notes{position:relative;z-index:1;background:transparent;overflow-y:scroll;flex:1}
.hlback{position:absolute;inset:0;overflow-y:scroll;overflow-x:hidden;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;color:transparent;font:14px/1.6 var(--f-ui);padding:12px 14px;border:1px solid transparent;border-radius:5px;background:var(--surface);pointer-events:none}
.hlback::-webkit-scrollbar-thumb{background:transparent}
.hlback mark{color:transparent;border-radius:3px;padding:0;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hlback mark.hl-ent{background:color-mix(in srgb,var(--c-ent) 26%,transparent);box-shadow:inset 0 -2px 0 var(--c-ent)}
.hlback mark.hl-rel{background:color-mix(in srgb,var(--c-rel) 26%,transparent);box-shadow:inset 0 -2px 0 var(--c-rel)}
.hlback mark.hl-att{background:color-mix(in srgb,var(--c-att) 24%,transparent);box-shadow:inset 0 -2px 0 var(--c-att)}
.hlbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 8px}
.hlbar .hl-lab{font-size:12.5px;color:var(--muted);margin-right:2px}
.hlbar .tspace{flex:1}
.hlb{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 11px 3px 9px;font:600 12.5px var(--f-ui);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.hlb::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--k,transparent);border:1.5px solid var(--kb,var(--line-2))}
.hlb:hover{background:var(--hover)}
.hlb.hl-ent{--k:color-mix(in srgb,var(--c-ent) 30%,transparent);--kb:var(--c-ent)}
.hlb.hl-rel{--k:color-mix(in srgb,var(--c-rel) 30%,transparent);--kb:var(--c-rel)}
.hlb.hl-att{--k:color-mix(in srgb,var(--c-att) 30%,transparent);--kb:var(--c-att)}
.hlb.hl-off::before{display:none}
.hlb[aria-pressed="true"]{border-color:var(--kb,var(--ink));box-shadow:0 0 0 2px var(--kb,var(--ink)) inset;background:var(--k,var(--hover))}
.hlb.hl-off[aria-pressed="true"]{--kb:var(--ink)}
textarea.hlpen{cursor:text;caret-color:var(--accent)}
.hlchip small{color:var(--muted);font-size:11px}
.hlbar.mini{gap:4px;margin:0 0 6px}
.hlbar.mini .hlb{padding:2px 7px 2px 6px;font-size:11.5px}
.hlchips{margin-top:10px;display:grid;gap:6px}
.hlchips .tnote{margin:0;font-size:12.5px;color:var(--muted)}
.hlrow{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.hlk{font:600 11px var(--f-ui);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);min-width:84px}
.hlchip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 4px 1px 9px;font-size:12.5px;border:1px solid var(--kb);background:var(--k)}
.hlchip.hl-ent{--k:color-mix(in srgb,var(--c-ent) 16%,transparent);--kb:var(--c-ent)}
.hlchip.hl-rel{--k:color-mix(in srgb,var(--c-rel) 16%,transparent);--kb:var(--c-rel)}
.hlchip.hl-att{--k:color-mix(in srgb,var(--c-att) 16%,transparent);--kb:var(--c-att)}
.hlchip button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:11px;padding:1px 4px;border-radius:999px}
.hlchip button:hover{background:var(--hover);color:var(--ink)}
.sqlbox{flex:1;width:100%;min-height:200px;resize:none;font:13px/1.6 var(--f-mono);color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:5px;padding:12px 14px;tab-size:2;white-space:pre;overflow:auto}
.sqlbox:focus{outline:none;border-color:var(--accent)}
.lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 5px}

/* Tiradores para cambiar el ancho */
.split{position:relative;cursor:col-resize;touch-action:none;outline:none}
.split::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;transform:translateX(-50%);background:transparent;transition:background .1s}
.split::before{content:"";position:absolute;top:50%;left:50%;width:3px;height:28px;transform:translate(-50%,-50%);border-left:1px dotted var(--line-2);border-right:1px dotted var(--line-2)}
.split:hover::after,.split:focus-visible::after,.split.drag::after{width:3px;background:var(--accent)}
.split:hover::before,.split.drag::before{opacity:0}
.split[data-split="en"]{grid-area:sp1} .split[data-split="in"]{grid-area:sp2}
.ed-main:not(.withenun) .split[data-split="en"]{display:none}
.split[data-split="side"]{position:absolute;top:0;bottom:0;right:-5px;width:9px;z-index:5}
.split[data-split="side"]::before{display:none}
body.resizing{cursor:col-resize;user-select:none}
body.resizing *{cursor:col-resize!important}

/* Pantalla inicial */
.welcome{margin:48px auto 0;max-width:560px;padding:0 20px}
.welcome h2{font-size:20px;font-weight:600;margin:0 0 6px;letter-spacing:-.2px}
.welcome p{color:var(--muted);margin:.4em 0 .9em}
.folder-demo{font:12.5px/1.9 var(--f-mono);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:10px 14px;margin:12px 0;word-break:break-all}
.folder-demo .d{color:var(--muted)}
.folder-demo .ico{vertical-align:-3px}
.welcome .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

/* Diálogos */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.32);display:grid;place-items:center;z-index:50;padding:16px}
.mbox{background:var(--surface);border:1px solid var(--line-2);border-radius:6px;box-shadow:0 12px 40px rgba(0,0,0,.25);width:min(620px,100%);max-height:90vh;display:flex;flex-direction:column;padding:16px 18px;overflow:auto}
.mbox h3{font-size:15px;font-weight:600;margin:0 0 4px}
.mbox p{margin:.2em 0 .8em;color:var(--muted)}
.mbox textarea{width:100%;flex:1;min-height:200px;font:12px/1.5 var(--f-mono);color:var(--ink);background:var(--panel);border:1px solid var(--line-2);border-radius:4px;padding:8px 10px;resize:vertical;word-break:break-all}
.mbox textarea:focus{outline:none;border-color:var(--accent)}
.mrow{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center;margin-top:12px}
.mmeta{margin-right:auto;color:var(--muted);font-size:12px}
.plist,.news{margin:6px 0;padding-left:20px;display:grid;gap:4px}
.plist li{color:var(--bad)}
.news li::marker{color:var(--accent)}
.mbox.wide{width:min(940px,100%)}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(390px,1fr));gap:4px 28px}
.ctrls h4{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin:12px 0 4px}
.ctrls dl{margin:0;display:grid;grid-template-columns:170px 1fr;gap:5px 10px;align-items:baseline}
.ctrls dt{font-size:12px;font-weight:600}
.ctrls dd{margin:0;font-size:12.5px;color:var(--muted)}
.dragghost{position:fixed;z-index:70;pointer-events:none;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 10px;font-size:11.5px;background:var(--surface);border:1px dashed var(--line-2);border-radius:5px;box-shadow:0 4px 14px rgba(0,0,0,.18);opacity:.75}
.dragghost.ok{border-color:var(--accent);opacity:1}
.dragghost .gl{width:24px;height:16px}
body.tooldrag,body.tooldrag *{cursor:grabbing!important;user-select:none}
.ed-tools .ebtn.tool{touch-action:none}
.older{margin-top:8px;font-size:12.5px}.older summary{cursor:pointer;color:var(--muted);font-weight:600}.older summary:hover{color:var(--ink)}
.relnotes{white-space:pre-wrap;font-size:12.5px;line-height:1.55;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:8px 12px;max-height:260px;overflow:auto;margin:4px 0}
.dlbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:10px}.dlfill{height:100%;width:0;background:var(--accent);transition:width .15s}
.sb-upd{display:inline-flex;align-items:center;gap:7px;color:var(--ink)}.upd-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.upd-mini{width:70px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex:none}.upd-fill{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}.upd-dot.bad{background:var(--bad)}
.news-h{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin:12px 0 2px}
.toast{position:fixed;right:16px;bottom:40px;background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:4px;font-size:12.5px;z-index:60;max-width:min(520px,calc(100% - 32px))}
.toast.warn{background:var(--bad);color:#fff}

/* SVG del lienzo */
svg .ln{stroke:var(--er-stroke);stroke-width:1.2}
svg .mk{stroke:var(--er-stroke);stroke-width:1.5;fill:none}
svg .mo{fill:var(--surface);stroke:var(--er-stroke);stroke-width:1.5}
svg .ent{fill:var(--e-fill);stroke:var(--c-ent);stroke-width:1.5}
svg .dia{fill:var(--r-fill);stroke:var(--c-rel);stroke-width:1.5}

svg .att{fill:var(--a-fill);stroke:var(--c-att);stroke-width:1.2}

svg .att.dr{stroke-dasharray:4 3}

svg .tbox{fill:var(--surface);stroke:var(--ded-border);stroke-width:1}
svg .thd{fill:var(--ded-head)}
svg .thx{font:600 12.5px var(--f-mono);fill:var(--ded-head-ink)}
svg .cx{font:11.5px var(--f-mono);fill:var(--ink)}
svg .cpk{fill:var(--pk-ink);font-weight:600}
svg .cfk{fill:var(--fk-ink)}
svg .cty{fill:var(--muted);font-weight:400}

svg .lk{stroke:var(--muted);stroke-width:1.4;fill:none}

svg .lkm{stroke:var(--muted);stroke-width:1.5;fill:none}
svg .lko{fill:var(--surface);stroke:var(--muted);stroke-width:1.5}
svg .ipk{fill:var(--pk)} svg .ifk{fill:var(--fk)} svg .icol{fill:var(--col)} svg .inul{fill:none;stroke:var(--col);stroke-width:1.3}
svg .rbox{fill:var(--surface);stroke:var(--ink);stroke-width:1.1}
svg .rnm{font:600 12.5px var(--f-mono);fill:var(--c-ent)}
svg .rcol{font:12px var(--f-mono);fill:var(--ink)}
svg .rpk{font-weight:700;fill:var(--pk-ink)}
svg .rfk{fill:var(--fk-ink)}
svg .rul{stroke:var(--pk-ink);stroke-width:1.1}
svg .rtag{font:600 9.5px var(--f-mono);fill:var(--muted)}
svg .rarr{fill:none;stroke:var(--fk);stroke-width:1.1}
svg .rhead{fill:var(--fk)}
svg .thx.dup{fill:#FFC2BD}
svg .cx.dup,svg .rnm.dup,svg .rcol.dup{fill:var(--bad);text-decoration:underline}
svg .hitl{stroke:transparent;stroke-width:14;cursor:pointer}
svg .lsel{stroke:var(--accent);stroke-width:2.4}
svg .selbox{fill:none;stroke:var(--accent);stroke-width:1.4;stroke-dasharray:4 3}
/* 2.0: Inicio y teoría */
.actbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-left:auto;padding:5px 8px 5px 10px;border:1px solid var(--accent);border-radius:8px;background:color-mix(in srgb,var(--accent) 10%,var(--surface));font-size:12.5px}
.actbar.over{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.act-tag{font:700 10.5px var(--f-ui);text-transform:uppercase;letter-spacing:.06em;color:#fff;background:var(--accent);padding:2px 7px;border-radius:4px}
.actbar.over .act-tag{background:var(--bad)}
.act-t{color:var(--ink)}
.act-clock{font:700 16px var(--f-mono);color:var(--accent);min-width:70px;text-align:center}
.act-clock.low{color:var(--bad);animation:actblink 1s steps(2) infinite}.act-clock.over{color:var(--bad);font-size:13px}
@keyframes actblink{50%{opacity:.35}}
:root.rm .act-clock.low{animation:none}
.rotag{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:600}

.homeb{display:flex;align-items:center;gap:8px;justify-content:flex-start}
.home{overflow:auto;padding:18px 22px 40px;display:flex;flex-direction:column;gap:22px}
.home>*{flex-shrink:0}
.home h3{margin:0 0 10px;font:600 12px var(--f-ui);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.home-top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;padding:18px 20px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.home-top h2{margin:0 0 4px;font-size:22px}.home-top p{margin:0;color:var(--muted)}.home-top .row{display:flex;gap:8px;flex-wrap:wrap}
.rc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.rc{display:flex;flex-direction:column;gap:4px;text-align:left;padding:8px 8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);cursor:pointer;color:var(--ink);font:inherit}
.rc:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.rc-th{display:block;width:100%;height:120px;border-radius:6px;background:var(--panel);overflow:hidden}.rc-th svg{width:100%;height:100%;display:block}
.rc-empty{display:flex;height:100%;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.rc-n{font:600 13.5px var(--f-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rc small{color:var(--muted);font-size:11.5px}
.thc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.thc{display:grid;grid-template-columns:22px 1fr;gap:4px 8px;align-items:center;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:9px;background:var(--surface);cursor:pointer;color:var(--ink);font:inherit}
.thc:hover{border-color:var(--accent)}.thc b{font-size:14px}.thc small{grid-column:1/-1;color:var(--muted);font-size:11.5px;line-height:1.4}
.home-th{overflow:hidden;padding:0}
.thv{display:grid;grid-template-columns:250px 1fr;height:100%;min-height:0}
.thv-nav{overflow:auto;border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:4px;background:var(--panel)}
.thv-nav .th-q{margin-bottom:8px}
.thn-c{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 8px;border:0;border-radius:6px;background:none;color:var(--ink);font:600 13px var(--f-ui);cursor:pointer}
.thn-ch.on>.thn-c{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.thn-s{display:flex;flex-direction:column;padding:2px 0 6px 26px}
.thn-b{text-align:left;border:0;background:none;padding:4px 6px;border-radius:5px;color:var(--muted);font:12.5px var(--f-ui);cursor:pointer}
.thn-b:hover{color:var(--ink)}.thn-b[aria-current="true"]{color:var(--accent);font-weight:600}
.thv-art{overflow:auto;padding:20px 30px 60px;max-width:none}
.thv-art h2{margin:0 0 6px;font-size:24px}
.th-sec{max-width:880px;padding-top:14px;border-top:1px solid var(--line);margin-top:18px}.th-sec:first-of-type{border-top:0;margin-top:0}
.th-sec h3{font-size:18px;margin:0 0 10px}
.th-fig{margin:10px 0 16px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:center;overflow-x:auto}

.th-fig figcaption{font-size:12.5px;color:var(--muted);margin-top:6px}
.th-code{font:12.5px/1.55 var(--f-mono);background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:8px 12px;margin:8px 0;white-space:pre;overflow-x:auto}
.th-row{display:flex;flex-wrap:wrap;gap:12px}

.th-cap{font-size:12px;color:var(--muted);margin:0 0 8px}
/* 1.9: notaciones, jerarquías, boceto, bloquear, comparar */
svg .ent.hd,svg .dia.hd{fill:none}
svg .ktag{font:700 9px var(--f-mono);fill:var(--muted)}

svg .dia.assoc{stroke-dasharray:5 3}

svg .dia.skd{stroke-width:1.3}

svg .dfbox{fill:none;stroke-width:2.6;stroke-dasharray:7 4}

svg .dfbox.chg{stroke:#D08A12}
.dfchip{border-color:#D08A12!important;color:#9A6408!important;font-size:12px}
.nsel{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:0 4px}
.nsel select{font:12px var(--f-ui);padding:3px 6px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink)}

.cmp-src{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.cmp-sel{margin-left:30px;max-width:340px;font:13px var(--f-ui);padding:5px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink)}
.cmp-code{margin-left:30px;width:calc(100% - 30px);font:12px var(--f-mono);padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);resize:vertical}
.cmp-parts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.cmp-sec{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:10px 0}
.cmp-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cmp-pct{font:600 12px var(--f-mono);padding:2px 8px;border-radius:10px;background:color-mix(in srgb,var(--accent) calc(var(--p)*1%),var(--bad) );color:#fff}
.cmp-h{margin:10px 0 4px;font-weight:600;font-size:12.5px}
.cmp-h.add{color:#2E9E5B}.cmp-h.del{color:var(--bad)}.cmp-h.chg{color:#B07410}
.cmp-l{margin:0;padding-left:1.3em;font-size:12.5px}.cmp-l li{margin:2px 0}
.tst-bad{margin:6px 0;padding:6px 8px;background:var(--panel);border-left:3px solid var(--bad);font:12px var(--f-mono);white-space:pre-wrap;max-height:120px;overflow:auto}
.tst-tip{color:var(--ink);background:color-mix(in srgb,var(--warn) 14%,transparent);padding:4px 8px;border-radius:4px}
:root.proj svg .tx,:root.proj svg .cx,:root.proj svg .rcol{font-weight:600}
svg .frombox{fill:none;stroke:var(--warn);stroke-width:2}
svg .band{fill:var(--sel);fill-opacity:.45;stroke:var(--accent);stroke-width:1;stroke-dasharray:4 3}
svg .hitbox{fill:transparent;cursor:move}
svg .node{cursor:move}
svg .card,svg .mk,svg .mo,svg .lkm,svg .lko{pointer-events:none}
svg .emp{font:14px var(--f-ui);fill:var(--muted)}

@media (max-width:1100px){ .sb-path{display:none} }
@media (prefers-reduced-motion:reduce){ .pf .chev{transition:none} }

/* ---------- 1.6.3: aspecto de aplicación ---------- */
.titlebar{grid-area:title;display:flex;align-items:center;gap:10px;height:36px;padding-left:12px;
  padding-right:calc(100vw - env(titlebar-area-x, 0px) - env(titlebar-area-width, 100vw) + 8px);
  background:var(--panel);border-bottom:1px solid var(--line);-webkit-app-region:drag;user-select:none;min-width:0}
.tb-left{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.tb-left b{font-size:13px;font-weight:600;white-space:nowrap}
.tb-proj{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tb-proj:not(:empty)::before{content:"—";margin-right:8px;color:var(--line-2)}
.tb-acts{display:flex;align-items:center;gap:2px;-webkit-app-region:no-drag}
.tbb{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px;border:0;border-radius:5px;background:none;color:var(--muted);font-size:12.5px;cursor:default}
.tbb:hover{background:var(--hover);color:var(--ink)}
.tbb:focus-visible{outline:2px solid var(--accent)}
.sidebtn{display:flex;align-items:center;gap:8px;width:100%;height:28px;padding:0 8px;border:0;border-radius:4px;background:none;color:var(--ink);text-align:left;cursor:default;font-size:12.5px;white-space:nowrap;overflow:hidden}
.sidebtn svg{flex:none;color:var(--muted)}.sidebtn span{overflow:hidden;text-overflow:ellipsis}
.sidebtn:hover{background:var(--hover)}
/* Sensación de programa: sin selección de texto en la interfaz, cursor normal, barras de desplazamiento finas */
body{user-select:none}
input,textarea,.relnotes,.th-art,.folder-demo,.mbox p,.mbox li{user-select:text}
.ebtn,.pf,.pi,.vtab,.sbtn,.segb,.tg,.chk,.opt,.aitem,.zb,.lnk,.set-nb,.th-nb,.algb{cursor:default}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:6px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:padding-box;border:2px solid transparent}
.ebtn{border-radius:5px}.ed-tools{border-radius:7px}.ed-cv{border-radius:7px}.ed-in{border-radius:7px}
.vtab{border-radius:5px 5px 0 0}
/* Notas */
svg .note{stroke-width:1.2}svg .note-fold{stroke-width:1.2;filter:brightness(.93)}
svg .nc-y{fill:#FFF4C2;stroke:#D2AE36}svg .nc-b{fill:#DDEBFA;stroke:#7AA3D6}svg .nc-g{fill:#DFF2E1;stroke:#7DBB87}svg .nc-p{fill:#FBE1EC;stroke:#D98AAE}
svg .note-tx{font:12px var(--f-ui);fill:#2B2A27}
svg .notecard{cursor:move;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.12))}
.segb.ncsw{font:600 11.5px var(--f-ui);color:#2B2A27;padding:4px 6px}
.segb.nc-y{background:#FFF4C2}.segb.nc-b{background:#DDEBFA}.segb.nc-g{background:#DFF2E1}.segb.nc-p{background:#FBE1EC}
.segb.ncsw[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent);background-blend-mode:normal}
.segb.ncsw[aria-pressed="true"].nc-y{background:#FFF4C2}.segb.ncsw[aria-pressed="true"].nc-b{background:#DDEBFA}.segb.ncsw[aria-pressed="true"].nc-g{background:#DFF2E1}.segb.ncsw[aria-pressed="true"].nc-p{background:#FBE1EC}
.ed-in textarea{width:100%;min-height:90px;resize:vertical;font:13px/1.45 var(--f-ui);color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:4px;padding:6px 8px}
.ed-in textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
/* Alinear */
.alg{display:flex;flex-wrap:wrap;gap:4px}
.algb{width:34px;height:30px;display:grid;place-items:center;border:1px solid var(--line-2);border-radius:5px;background:var(--surface);color:var(--ink)}
.algb:hover{background:var(--hover);border-color:var(--accent)}
/* Ajustes */
.mbox.settings{width:min(1080px,100%);height:min(720px,92vh);max-height:none;padding:0;overflow:hidden;position:relative}
.set-wrap{display:grid;grid-template-columns:210px minmax(0,1fr);height:100%;min-height:0}
.set-nav{background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.set-title{font-size:15px;font-weight:600;margin:2px 8px 10px}
.set-nb{display:flex;align-items:center;gap:9px;height:32px;padding:0 10px;border:0;border-radius:5px;background:none;color:var(--ink);text-align:left;font-size:13px}
.set-nb .gl{color:var(--muted)}
.set-nb:hover{background:var(--hover)}
.set-nb[aria-current="true"]{background:var(--sel);color:var(--sel-ink);font-weight:600}
.set-nb[aria-current="true"] .gl{color:var(--accent)}
.set-body{padding:20px 26px;overflow:auto;min-height:0}
.set-body h3{font-size:18px;font-weight:600;margin:0 0 4px}
.set-sub{color:var(--muted);margin:0 0 14px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.set-lab{display:flex;flex-direction:column;min-width:0;flex:1 1 220px}
.set-lab small{color:var(--muted);font-size:12px}
.set-body .chk{margin:8px 0;padding:10px 12px}
.set-x{position:absolute;top:10px;right:12px;width:30px;height:30px;border:0;border-radius:5px;background:none;color:var(--muted);font-size:14px}
.set-x:hover{background:var(--hover);color:var(--ink)}
.set-prev{display:flex;align-items:center;gap:8px;margin-top:14px;padding:12px;border:1px dashed var(--line-2);border-radius:6px}
.set-chip{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:4px}
.about{display:flex;flex-direction:column}
.about-logo{display:flex;align-items:center;gap:14px;padding:6px 0 14px;border-bottom:1px solid var(--line)}
.about-logo b{display:block;font-size:15px}.about-logo small{color:var(--muted)}
/* Teoría */
.th-wrap{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;height:100%;min-height:0;margin:-20px -26px;padding:0}
.th-side{border-right:1px solid var(--line);padding:16px 10px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.th-q{width:100%;height:30px;border:1px solid var(--line-2);border-radius:5px;padding:0 9px;background:var(--surface);color:var(--ink);font-size:12.5px}
.th-q:focus{outline:none;border-color:var(--accent)}
.th-list{display:flex;flex-direction:column;gap:1px}
.th-nb{display:flex;gap:8px;align-items:baseline;text-align:left;border:0;background:none;padding:6px 8px;border-radius:5px;color:var(--ink);font-size:12.5px;line-height:1.35}
.th-nb:hover{background:var(--hover)}.th-nb[aria-current="true"]{background:var(--sel);color:var(--sel-ink);font-weight:600}
.th-n{font:600 10.5px var(--f-mono);color:var(--muted);min-width:16px}
.th-art{padding:20px 26px 30px 0;overflow:auto;min-height:0;max-width:820px;line-height:1.6;font-size:13.5px}
.th-art h3{font-size:19px;margin:0 0 10px}.th-art h4{font-size:14px;margin:18px 0 6px}
.th-art p,.th-art li{max-width:72ch}.th-art ul,.th-art ol{padding-left:1.3em}.th-art li{margin:.25em 0}
.th-art code,.th-code{font-family:var(--f-mono)}
.th-code{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px;font-size:12.5px;line-height:1.6;margin:8px 0;overflow-x:auto;white-space:nowrap}
.th-code u{text-decoration-color:var(--pk-ink);text-decoration-thickness:1.5px}
.th-tip{border-left:3px solid var(--accent);background:var(--sel);color:var(--ink);padding:8px 12px;border-radius:0 6px 6px 0;margin:12px 0}
.th-ex{border:1px solid var(--line);background:var(--panel);padding:9px 12px;border-radius:6px;margin:10px 0}
.th-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin:10px 0}
.th-card{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--surface);margin:8px 0}.th-grid .th-card{margin:0}
.th-card h4{margin:0 0 4px}.th-card p{margin:.3em 0}
.th-sym{display:inline-flex;align-items:center;gap:7px;font-weight:600;white-space:nowrap}
.th-art li>.gl,.th-art p>.gl{display:inline-block;vertical-align:-3px;margin:0 3px 0 6px}
.th-tab{border-collapse:collapse;width:100%;margin:8px 0;font-size:13px}
.th-tab th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 10px;background:var(--panel)}
.th-tab td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
.th-steps li{margin:.5em 0}.th-list li{margin:.45em 0}
.th-dl dt{font-weight:600;margin-top:10px}.th-dl dd{margin:2px 0 0;color:var(--muted)}
/* Color principal */
:root[data-accent="blue"]{--accent:#2B5FA8;--sel:#E2EAF6;--sel-ink:#16325A}

  :root[data-accent="blue"]:not([data-theme="light"]){--accent:#7EA8E6;--accent-ink:#0F203A;--sel:#24344C;--sel-ink:#E3ECF8}
  :root[data-accent="purple"]:not([data-theme="light"]){--accent:#B497E6;--accent-ink:#21123A;--sel:#33284A;--sel-ink:#EFE8FA}

:root[data-theme="dark"][data-accent="orange"]{--accent:#EB9A62;--accent-ink:#2E1505;--sel:#43301F;--sel-ink:#FBEADD}

:root.hc{--line:#A9A69E;--line-2:#6F6D67;--muted:#45443F;--hover:#E2E0DA}
@media (prefers-color-scheme: dark){:root.hc:not([data-theme="light"]){--line:#5E5F64;--line-2:#8A8B90;--muted:#C9C8C3;--hover:#3A3B3F}}

:root.cb[data-theme="dark"]{--c-ent:#56B4E9;--c-rel:#E69F00;--c-att:#3FC59C;--c-key:#E7A3C9;--pk-ink:#E7A3C9;--fk:#F08A3C;--fk-ink:#F5A060;--card:#F08A3C;--k-fill:#3E2836}
:root.focusall :focus{outline:2px solid var(--accent)!important;outline-offset:1px}
:root.rm *,:root.rm *::before,:root.rm *::after{transition:none!important;animation:none!important}

/* ---------- 1.7 ---------- */
.ctxmenu{position:fixed;z-index:80;min-width:210px;max-width:320px;background:var(--surface);border:1px solid var(--line-2);border-radius:7px;box-shadow:0 10px 28px rgba(0,0,0,.22);padding:4px;display:flex;flex-direction:column}
.cx-it{display:flex;align-items:center;gap:8px;height:28px;padding:0 10px 0 6px;border:0;border-radius:4px;background:none;color:var(--ink);font-size:12.5px;text-align:left;cursor:default}
.cx-it:hover:not(:disabled),.cx-it:focus-visible{background:var(--sel);color:var(--sel-ink);outline:none}
.cx-it:disabled{opacity:.45}.cx-it.danger{color:var(--bad)}
.cx-ck{width:14px;text-align:center;color:var(--accent);font-weight:700}.cx-lb{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cx-k{font:11px var(--f-mono);color:var(--muted)}

.cx-row{display:flex;flex-wrap:wrap;gap:3px;padding:4px 4px 2px}
.cx-ic{width:30px;height:28px;display:grid;place-items:center;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);cursor:default}
.cx-ic:hover,.cx-ic:focus-visible{background:var(--sel);border-color:var(--accent);outline:none}
.cx-sw{width:26px;height:22px;border:1px solid var(--line-2);border-radius:4px;cursor:default}.cx-sw.on{box-shadow:inset 0 0 0 2px var(--accent)}
.cx-sw.nc-y{background:#FFF4C2}.cx-sw.nc-b{background:#DDEBFA}.cx-sw.nc-g{background:#DFF2E1}.cx-sw.nc-p{background:#FBE1EC}
.cv-search{position:absolute;top:10px;right:10px;z-index:4;display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:4px 4px 4px 9px;width:min(360px,calc(100% - 20px));background:var(--surface);border:1px solid var(--line-2);border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.14);color:var(--muted)}

.cv-search.none input{color:var(--bad)}
.cs-cnt{font:11.5px var(--f-mono);color:var(--muted);min-width:28px;text-align:right}
.cs-b{width:26px;height:26px;border:0;border-radius:4px;background:none;color:var(--ink);font-size:15px;cursor:default}.cs-b:hover{background:var(--hover)}
.cs-what{flex-basis:100%;font-size:11.5px;color:var(--muted);padding:0 4px 2px 18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cs-what:empty{display:none}
.tlab{font-size:12px;color:var(--muted);padding:0 4px}
.seg.dial .segb{font:600 12px var(--f-ui);padding:4px 10px}
/* Probar */
.tst-main{flex:1;min-height:0;display:grid;grid-template-columns:240px minmax(0,1fr);gap:10px}
.tst-schema{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:0}
.tst-t{display:grid;grid-template-columns:1fr auto;gap:2px 6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:6px 8px;color:var(--ink);cursor:default}
.tst-t:hover{border-color:var(--accent)}
.tst-tn{font:600 12.5px var(--f-mono);color:var(--c-ent)}.tst-t .cnt{font:11px var(--f-mono);color:var(--muted)}
.tst-cols{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:2px 8px;font:11px var(--f-mono);color:var(--muted)}
.tst-cols span{display:inline-flex;align-items:center;gap:2px}.tst-cols .gl{width:14px;height:12px}.tst-cols .pk{color:var(--pk-ink)}.tst-cols .fk{color:var(--fk-ink)}
