name: Publicar versión

# Cuando cambia la versión en package.json (en main), construye la app para Windows, Linux y macOS
# y crea la Release vX.Y.Z. Si esa versión ya está publicada, no hace nada.
on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - name: Versión
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La versión v$V ya está publicada: no hay nada que hacer."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  construir:
    needs: version
    if: needs.version.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - plat: win
            os: ubuntu-latest
          - plat: linux
            os: ubuntu-latest
          - plat: mac
            os: macos-14
    runs-on: ${{ matrix.os }}
    # si el Mac no consigue máquina (a veces GitHub tarda o falla), se publica igual Windows y Linux
    continue-on-error: ${{ matrix.plat == 'mac' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Pruebas
        if: matrix.plat == 'win'
        run: node test-storage.js
      - name: Construir (${{ matrix.plat }})
        run: |
          F=$(bash build.sh ${{ matrix.plat }} | tail -1)
          # Huella del paquete: la app la comprueba antes de instalar la actualización
          shasum -a 256 "$F" > "$F.sha256"
          ls -la "$F" "$F.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: paquete-${{ matrix.plat }}
          path: |
            Modelado-Bases-*.zip
            Modelado-Bases-*.tar.gz
            Modelado-Bases-*.sha256
          if-no-files-found: error

  publicar:
    needs: [version, construir]
    if: ${{ always() && needs.version.outputs.skip != 'true' && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: paquetes
          merge-multiple: true
      - name: Publicar la Release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.version }}
        run: |
          ls -la paquetes
          # sin el paquete de Windows no se publica (es el que usan las actualizaciones automáticas)
          ls paquetes/*-Windows.zip >/dev/null
          bash release-notes.sh > notes.md
          cat notes.md
          gh release create "v$V" paquetes/* --target "$GITHUB_SHA" \
            --title "Modelado Bases ${V%.0}" --notes-file notes.md --latest
